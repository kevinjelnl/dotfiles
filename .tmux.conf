set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# ============================================================================
# General settings
# ============================================================================

# Use Ctrl-a as the prefix, matching your existing muscle memory.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Reload configuration.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Keep escape-sequence parsing fast while allowing terminal OSC replies to
# arrive in more than one read from Windows Terminal.
set -sg escape-time 25
set -g repeat-time 600

# Start windows and panes at 1.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing one.
set -g renumber-windows on

# Terminal and color support.
set -g default-terminal "screen-256color"

# Scrollback history.
set -g history-limit 100000

# Activity and bell settings.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ============================================================================
# Shell
# ============================================================================

# ============================================================================
# Mouse and copy mode
# ============================================================================

set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

# Copy a mouse selection when the drag ends.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Vi-style copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# ============================================================================
# Pi compatibility
# ============================================================================
#
# tmux 3.4 supports extended keys, but not CSI-u.
# Do not add:
#
#   set -g extended-keys-format csi-u
#
# Pi should use the older extended-key format with tmux 3.4.

set -g extended-keys on
set -as terminal-features ",*:extkeys"

# ============================================================================
# Pane navigation
# ============================================================================

# Prefix + Vim keys.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Alt + Vim keys without the prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# ============================================================================
# Pane resizing
# ============================================================================

# Prefix + Shift + Vim keys.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Alt + arrow keys without the prefix.
bind-key -n M-Left  resize-pane -L 5
bind-key -n M-Down  resize-pane -D 5
bind-key -n M-Up    resize-pane -U 5
bind-key -n M-Right resize-pane -R 5

# Balance pane sizes.
bind-key = select-layout even-horizontal
bind-key + select-layout even-vertical

# ============================================================================
# Windows
# ============================================================================

# Create a new window in the current directory.
bind-key c new-window -c "#{pane_current_path}"

# Move between windows.
bind-key n next-window
bind-key p command-prompt -p "Pane title:" "select-pane -T '%%'"
bind-key P previous-window

# Shift + arrow keys switch windows without the prefix.
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Move the current window left or right.
bind-key '<' swap-window -t -1
bind-key '>' swap-window -t +1

# ============================================================================
# Panes
# ============================================================================

# Cycle panes and keep the zoomed layout when already zoomed.
bind-key o if-shell -F '#{window_zoomed_flag}' "resize-pane -Z; select-pane -t :.+; resize-pane -Z" "select-pane -t :.+"
bind-key -n M-o if-shell -F '#{window_zoomed_flag}' "resize-pane -Z; select-pane -t :.+; resize-pane -Z" "select-pane -t :.+"

# Split in the current directory.
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"

# Toggle the current pane fullscreen.
bind-key z resize-pane -Z

# Display pane numbers.
bind-key q display-panes
set -g display-panes-time 3000

# Kill the current pane.
bind-key x kill-pane

# ============================================================================
# Session shortcuts
# ============================================================================

# List sessions.
bind-key s choose-tree -s

# Rename the current session.
bind-key S command-prompt -I "#S" "rename-session '%%'"

# Rename the active pane.
bind-key T command-prompt -p "Pane title:" "select-pane -T '%%'"

# Detach from the current session.
bind-key d detach-client

# ============================================================================
# Status bar
# ============================================================================

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 100

set -g status-style "bg=black,fg=white"
# Make the active pane separator easy to distinguish without thick borders.
set -g pane-border-lines simple
# Show pane headers only when a window has multiple panes.
set -g pane-border-status off
set-hook -g after-split-window {
  if-shell -F "#{>:#{window_panes},1}" "set-window-option pane-border-status top"
  select-pane -T "tmux-pane-#{pane_index}"
}
set-hook -g after-new-window 'select-pane -T "tmux-pane-#{pane_index}"'
set-hook -g after-new-session 'select-pane -T "tmux-pane-#{pane_index}"'
set-hook -g after-kill-pane 'if-shell -F "#{==:#{window_panes},1}" "set-window-option pane-border-status off"'
set-hook -g pane-exited 'if-shell -F "#{==:#{window_panes},1}" "set-window-option pane-border-status off"'
set-hook -g pane-died 'if-shell -F "#{==:#{window_panes},1}" "set-window-option pane-border-status off"'
set -g pane-border-format "#{?pane_active,──#[fg=colour16]#[bg=colour166]#[bold][  ↓  ]#[default]── #[fg=colour166]#[bold]#T#[default] #[fg=colour166]📁 #{s|^#{HOME}|~|:pane_current_path}#[default],#[fg=colour245]#[bg=colour238]──[ #T ]── #[fg=colour245]📁 #{s|^#{HOME}|~|:pane_current_path}#[default]}"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour166"

set -g window-status-style "fg=colour245,bg=black"
set -g window-status-current-style "fg=black,bg=white,bold"

set -g status-left "#[fg=colour208,bold](#S) #[fg=white]#{user} #[fg=colour238]|"
set -g status-right "#[fg=colour245]load #(awk '{print \$1\" \"\$2\" \"\$3}' /proc/loadavg 2>/dev/null) #[fg=colour238]| #[fg=colour245]%Y-%m-%d #[fg=colour208]%H:%M"

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# End of tmux configuration.
