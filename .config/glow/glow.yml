# Use Glow's dark Glamour style for readable headings, code blocks, and tables.
style: "dark"
# Allow mouse scrolling when Glow is running interactively.
mouse: true
# Keep shell output focused; Neovim opens its own pager session.
pager: false
# Give Markdown tables and code blocks more room on a VPS terminal.
width: 100
# Do not include hidden files when browsing directories.
all: false
